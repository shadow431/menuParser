  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.14.0
    container_name: mealie
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    environment:
      ALLOW_SIGNUP: "${MEALIE_ALLOW_SIGNUP:-true}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-America/Chicago}"
      BASE_URL: "${MEALIE_BASE_URL:-http://localhost:9925}"
      DB_ENGINE: postgres
      POSTGRES_USER: "${POSTGRES_USER:-mealie}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-mealie}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-mealie}"
      SMTP_AUTH_STRATEGY: "${SMTP_AUTH_STRATEGY:-TLS}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-mealie@example.com}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
    volumes:
      - mealie-data:/app/data/

  postgres:
    image: postgres:17
    container_name: mealie-postgres
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}" # Replace with your desired UID:GID
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      POSTGRES_USER: "${POSTGRES_USER:-mealie}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      POSTGRES_DB: "${POSTGRES_DB:-mealie}"
      PGUSER: "${POSTGRES_USER:-mealie}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealie} -d ${POSTGRES_DB:-mealie}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data

volumes:
  mealie-data:
  mealie-pgdata:
