services:
  mealie:
    volumes:
      - mealie-data:/app/data/

  postgres:
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data

volumes:
  mealie-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nfsvers=${NFS_VERSION:-4},rw,soft
      device: :${NFS_MEALIE_DATA_PATH}
  mealie-pgdata:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},nfsvers=${NFS_VERSION:-4},rw,hard #,timeo=600,retrans=2,fg,rsize=8192,wsize=8192,noatime,acregmin=0,acregmax=0,acdirmin=0,acdirmax=0
      device: :${NFS_MEALIE_PGDATA_PATH}
